# Render Blueprint for L.I.F.E. (https://render.com/docs/blueprint-spec)
#
# Default: FREE plan. Render's free plan has no persistent disk, so on its own the SQLite
# database (trainees, accounts, sessions) is erased whenever the service restarts, redeploys
# or sleeps (after ~15 minutes without visitors).
#
# To KEEP data for FREE: fill in TURSO_DATABASE_URL and TURSO_AUTH_TOKEN (a free Turso
# database; steps in LIFE/docs/deploy-render.md). The server then saves a copy of the database
# to Turso after every change and restores it at every start, so data stays until deleted.
#
# To KEEP data (paid) instead: change `plan: free` to `plan: starter`, and uncomment the
# `disk:` block and the LIFE_DB_PATH variable below.

services:
  - type: web
    name: life-cpr
    runtime: node
    rootDir: LIFE                # the app lives in the LIFE folder of this repository
    plan: free
    region: singapore            # closest Render region to the Philippines
    buildCommand: npm ci --prefix server && npm ci --include=dev --prefix dashboard && npm run build --prefix dashboard
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Signs sign-in tokens; Render generates a random value once.
      - key: JWT_SECRET
        generateValue: true
      # Admin sign-in works out of the box: username "admin", password "LifeCPR@2026".
      # Optional: to use your own admin password instead (at least 12 characters), add an
      # environment variable LIFE_ADMIN_PASSWORD in the Render dashboard.
      # Free permanent storage (Turso). Render asks for these values when the Blueprint is
      # created; otherwise add them under Environment. Leave both empty to keep data only
      # until the next restart.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Paid plan with a disk: store the database on the disk.
      # - key: LIFE_DB_PATH
      #   value: /var/data/life.db
    # disk:
    #   name: life-data
    #   mountPath: /var/data
    #   sizeGB: 1
