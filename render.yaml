# Render Blueprint for L.I.F.E. (https://render.com/docs/blueprint-spec)
#
# Default: FREE plan for demos. Render's free plan has no persistent disk, so the SQLite
# database (trainees, accounts, sessions) is erased whenever the service restarts, redeploys
# or sleeps (after ~15 minutes without visitors).
#
# To KEEP data (paid): change `plan: free` to `plan: starter`, and uncomment the `disk:` block
# and the LIFE_DB_PATH variable below.

services:
  - type: web
    name: life-cpr
    runtime: node
    rootDir: LIFE                # the app lives in the LIFE folder of this repository
    plan: free
    region: singapore            # closest Render region to the Philippines
    buildCommand: npm ci --prefix server && npm ci --include=dev --prefix dashboard && npm run build --prefix dashboard
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Signs sign-in tokens; Render generates a random value once.
      - key: JWT_SECRET
        generateValue: true
      # Admin sign-in works out of the box: username "admin", password "LifeCPR@2026".
      # Optional: to use your own admin password instead (at least 12 characters), add an
      # environment variable LIFE_ADMIN_PASSWORD in the Render dashboard.
      # Paid plan with a disk: store the database on the disk.
      # - key: LIFE_DB_PATH
      #   value: /var/data/life.db
    # disk:
    #   name: life-data
    #   mountPath: /var/data
    #   sizeGB: 1
